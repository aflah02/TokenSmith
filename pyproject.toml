[tool.poetry]
name = "tokensmith"
version = "0.1.0"
description = "A Package for Streamlining Data Editing, Search, and Inspection for Large-Scale Language Model Training and Interpretability"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/aflah02/tokensmith"
repository = "https://github.com/aflah02/tokensmith"
keywords = ["dataset", "management", "editing", "sampling", "exporting", "searching"]

[tool.poetry.dependencies]
python = "^3.8"
# Core dependencies
numpy = "^1.21.0"
pandas = "^1.3.0"
tqdm = "^4.62.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.0"
mkdocs-material = "^9.0.0"
mkdocstrings = {extras = ["python"], version = "^0.24.0"}
mkdocstrings-python = "^1.7.0"

[tool.poetry.group.ui.dependencies]
streamlit = "^1.20.0"
altair = "^4.2.0"

[tool.poetry.group.search.dependencies]
tokengrams = "^0.3.0"

[tool.poetry.group.all.dependencies]
# All optional dependencies for complete functionality
streamlit = "^1.20.0"
altair = "^4.2.0"
tokengrams = "^0.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"