[tool.poetry]
name = "tokensmith"
version = "0.1.1"
description = "A Package for Streamlining Data Editing, Search, and Inspection for Large-Scale Language Model Training and Interpretability"
authors = ["Mohammad Aflah Khan <afkhan@mpi-sws.org>", "Ameya Godbole <ameyagod@usc.edu>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/aflah02/tokensmith"
repository = "https://github.com/aflah02/tokensmith"
keywords = ["dataset", "management", "editing", "sampling", "exporting", "searching"]

[tool.poetry.dependencies]
python = ">=3.11"
# Core dependencies
numpy = "^1.26.4"
pandas = "^2.2.3"
tqdm = "^4.67.1"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.14"
mkdocstrings = { extras = ["python"], version = "^0.29.1" }
mkdocstrings-python = "^1.16.12"
mkdocs-autorefs = "^1.4.2"
mkdocs-material-extensions = "^1.3.1"
mkdocs-get-deps = "^0.2.0"
mkdocs-jupyter = "^0.25.1"

[tool.poetry.group.ui.dependencies]
streamlit = "^1.46.0"
altair = "^5.5.0"

[tool.poetry.group.search.dependencies]
tokengrams = "^0.3.3"

[tool.poetry.group.all.dependencies]
# All optional dependencies for complete functionality
streamlit = "^1.46.0"
altair = "^5.5.0"
tokengrams = "^0.3.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"